<!doctype html>
<html lang="en">

<body>
<canvas id="c"></canvas>
<script id="src">
// rose.js : a rose forged out of fire, drawn only with the characters of its own source code.
// Every glyph on the petals is taken from this file. Click or press space to forge it again.
const TAU = Math.PI * 2, PI = Math.PI;
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const glow = document.createElement('canvas'), gctx = glow.getContext('2d');
const SOURCE = document.getElementById('src').textContent.replace(/\s+/g, '');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = (t) => { t = clamp(t, 0, 1); return t * t * t * (t * (6 * t - 15) + 10); };
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const hash2 = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
const NT = new Float32Array(65536); for (let i = 0; i < 65536; i++) NT[i] = hash2(i & 255, i >> 8);
function noise(x, y) {                                   // smooth value noise
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const x0 = xi & 255, x1 = (xi + 1) & 255, y0 = (yi & 255) << 8, y1 = ((yi + 1) & 255) << 8;   // table lookups, no sines
  const a = NT[y0 | x0], b = NT[y0 | x1], c = NT[y1 | x0], d = NT[y1 | x1];
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

// ---------- the build schedule: [start, end] in seconds for each part ----------
const ROSE = 0, STEM = 1, LEAF = 2, SEPAL = 3;
const WHEN = [[4.4, 13.0], [1.3, 4.0], [3.2, 5.6], [3.9, 4.8]];
const DONE = 13.0;

// ---------- geometry ----------
const pos = [], nor = [], meta = [];
function surface(NI, NJ, f, kind, growOf, shadeOf) {
  const g = new Float32Array(NI * NJ * 3);
  for (let i = 0; i < NI; i++) for (let j = 0; j < NJ; j++) g.set(f(i / (NI - 1), j / (NJ - 1)), (i * NJ + j) * 3);
  for (let i = 0; i < NI; i++) for (let j = 0; j < NJ; j++) {
    const a = (i * NJ + j) * 3, b = (Math.min(i + 1, NI - 1) * NJ + j) * 3, c = (i * NJ + Math.min(j + 1, NJ - 1)) * 3;
    const b0 = (Math.max(i - 1, 0) * NJ + j) * 3, c0 = (i * NJ + Math.max(j - 1, 0)) * 3;
    const ux = g[b] - g[b0], uy = g[b + 1] - g[b0 + 1], uz = g[b + 2] - g[b0 + 2];
    const vx = g[c] - g[c0], vy = g[c + 1] - g[c0 + 1], vz = g[c + 2] - g[c0 + 2];
    const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx, l = Math.hypot(nx, ny, nz) || 1;
    const u = i / (NI - 1), v = j / (NJ - 1), n = pos.length / 3;
    pos.push(g[a], g[a + 1], g[a + 2]); nor.push(nx / l, ny / l, nz / l);
    // each point appears at its own instant: a little scatter makes the front arrive glyph by glyph
    meta.push(kind, (i >> 2) * 131 + (j >> 3) * 17, clamp(growOf(u, v) * 0.955 + hash(n) * 0.045, 0, 1), shadeOf(u, v));
  }
}

// the rose: one spiral sheet of petals
//   open = exp(-theta / (8 PI))
//   u    = 1 - (1 - mod(3.6 theta, 2 PI) / PI)^4 / 2
//   cup  = sin(PI x / 2)^0.6
//   r    = (0.55 + 0.45 u) ((0.12 + 0.5 open) cup + 0.16 open x^6),  h = u x^1.6 (1.3 - 0.12 open) - 0.1 open x^6
function rose(x, t) {
  const theta = -2 * PI + t * 17 * PI, open = Math.exp(-theta / (8 * PI));          // 1.28 on the outer petals, near 0 at the heart
  const m = ((3.6 * theta) % TAU + TAU) % TAU, u = 1 - Math.pow(1 - m / PI, 4) / 2;
  const cup = Math.pow(Math.sin(PI * x * 0.6), 0.5), lip = Math.pow(x, 6) * open;    // a round cup that narrows, then its rim curls out
  const r = (0.55 + 0.45 * u) * ((0.12 + 0.5 * open) * cup + 0.16 * lip), h = u * Math.pow(x, 1.6) * (1.3 - 0.12 * open) - 0.1 * lip;
  return [r * Math.cos(theta), r * Math.sin(theta), h];
}
// shade: dark at the base and in the seams between petals, bright along each petal's rim
const seam = (t) => { const th = -2 * PI + t * 17 * PI, m = ((3.6 * th) % TAU + TAU) % TAU; return Math.sqrt(Math.sin(PI * m / TAU)); };
surface(150, 1500, rose, ROSE, (x, t) => 1 - t, (x, t) => x * (0.5 + 0.5 * seam(t)));

const stemAt = (s) => [0.13 * Math.sin(2.9 * s) * s, 0.06 * Math.sin(4.8 * s), -3.7 * s];
surface(420, 14, (s, a) => {
  const c = stemAt(s), rad = 0.036 + 0.012 * (1 - s) * (1 - s);
  return [c[0] + rad * Math.cos(a * TAU), c[1] + rad * Math.sin(a * TAU), c[2] + 0.02];
}, STEM, (s) => 1 - s, () => 0.6);

surface(40, 160, (x, a) => {                             // sepals: the green cup under the bloom
  const th = a * TAU, w = 0.55 + 0.45 * Math.pow(Math.abs(Math.cos(2.5 * th)), 0.6);
  const r = 0.42 * x * w;
  return [r * Math.cos(th), r * Math.sin(th), 0.16 * x * x - 0.05 + 0.1 * x * (1 - w)];
}, SEPAL, (x) => x, (x) => 0.35 + 0.5 * x);

function leaf(s0, yaw, len, wid, order) {
  const b = stemAt(s0), dx = Math.cos(yaw), dy = Math.sin(yaw);
  surface(110, 64, (u, v0) => {
    const v = v0 * 2 - 1, w = wid * Math.pow(Math.sin(PI * Math.min(1, u * 1.04)), 0.75) * (1 - 0.35 * u);
    const out = u * len, lift = 0.34 * Math.sin(PI * u * 0.8) - 0.22 * u * u - 0.5 * w * v * v;
    return [b[0] + dx * out - dy * v * w, b[1] + dy * out + dx * v * w, b[2] + lift + 0.12 * u];
  }, LEAF, (u) => u * 0.62 + order * 0.38, (u, v0) => 0.45 + 0.55 * Math.abs(v0 * 2 - 1));
}
leaf(0.72, 3.5, 1.2, 0.3, 0); leaf(0.52, 0.5, 1.05, 0.27, 1); leaf(0.88, 1.9, 0.95, 0.25, 0.4); leaf(0.36, 4.6, 0.8, 0.22, 0.8);

const N = pos.length / 3, POS = new Float32Array(pos), NOR = new Float32Array(nor), META = new Float32Array(meta);

// builder sparks: a few hundred points get a spark that flies out of the fire and lands on them
const BUILD = [];
for (let k = 0; k < N; k++) {
  const kind = META[k * 4], stride = kind === ROSE ? 150 : kind === STEM ? 30 : 80;
  if (k % stride === 0) BUILD.push(k);
}

// ---------- palettes ----------
const LV = 32, RED = [], GREEN = [], FIRE = [], DUST = [], LOVE = [];
for (let i = 0; i < LV; i++) {
  const b = i / (LV - 1);
  // a real night rose: almost black in the folds, deep blood red in the light, never pink
  RED.push(`rgb(${Math.round(34 + 200 * Math.pow(b, 0.85))},${Math.round(1 + 22 * Math.pow(b, 2.6))},${Math.round(6 + 36 * Math.pow(b, 2.0))})`);
  GREEN.push(`rgb(${Math.round(8 + 40 * b * b)},${Math.round(40 + 112 * Math.pow(b, 1.0))},${Math.round(22 + 46 * b)})`);
  DUST.push(`rgb(${Math.round(255 * b)},${Math.round(185 * b)},${Math.round(145 * b)})`);          // warm glints
  LOVE.push(`rgb(${Math.round(226 * b)},${Math.round(40 * b)},${Math.round(62 * b)})`);            // rose red, for hearts and the far background
  FIRE.push(`rgb(${Math.round(110 + 145 * Math.pow(b, 0.45))},${Math.round(14 + 236 * Math.pow(b, 1.35))},${Math.round(6 + 230 * Math.pow(b, 3.4))})`);
}
const PRGB = [FIRE, RED, GREEN, DUST, LOVE].map((p) => p.map((c) => c.match(/\d+/g).map(Number)));   // the same colours as numbers
const FLAME = '.:^*xs#$%@', EMBER = "*+.'`";

// ---------- the code that types itself beside the flower ----------
const LINES = [
  '// rose.js', 'ignite()', "const you = 'my favourite person'",
  'while (forever) {', '  love(you)   // i love you', '}',
];

let W = 0, H = 0, FS = 10, CW = 6, CH = 11, COLS = 0, ROWS = 0, zbuf, ibuf, DPR = 1, Q = 1;
const TOUCH = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
const LOD = TOUCH ? 0.55 : 1;                             // phones draw about half the loose particles
function resize() {
  const dpr = DPR = Math.min(window.devicePixelRatio || 1, TOUCH ? 1.5 : 2);     // fixed: the picture never gets coarser, slow phones shed work instead
  // a phone held upright gets the same wide picture as a computer, turned on its side: turn the phone to watch it
  const turned = TOUCH && innerHeight > innerWidth, vw = turned ? innerHeight : innerWidth, vh = turned ? innerWidth : innerHeight;
  canvas.style.inset = 'auto'; canvas.style.left = '0'; canvas.style.top = '0'; canvas.style.width = vw + 'px'; canvas.style.height = vh + 'px';
  canvas.style.transformOrigin = '0 0'; canvas.style.transform = turned ? `translateX(${innerWidth}px) rotate(90deg)` : 'none';
  W = canvas.width = Math.round(vw * dpr); H = canvas.height = Math.round(vh * dpr);
  FS = TOUCH ? Math.max(5, Math.round(H / 100)) : Math.max(7, Math.round(Math.min(H / 118, W / 150)));   // about 100 rows of glyphs on a phone
  CW = FS * 0.62; CH = FS * 1.08;
  COLS = Math.ceil(W / CW); ROWS = Math.ceil(H / CH);
  zbuf = new Float32Array(COLS * ROWS); ibuf = new Int32Array(COLS * ROWS);
  glow.width = W >> 2; glow.height = H >> 2;
  // glyph atlas: every (colour, character) pair is drawn once here, then copied. Far cheaper than drawing text 20,000 times a frame.
  AC = Math.ceil(CW) + 1; AR = Math.ceil(CH) + 2; AN = Math.floor(2048 / AC);
  atlas.width = 2048; atlas.height = AR * Math.ceil(8000 / AN); slots.clear();
  actx.textBaseline = 'top'; actx.font = `${FS}px ui-monospace, "SF Mono", Menlo, Consolas, monospace`;
  // small screens (phones): skip thousands of draw calls. Glyphs are blended into one pixel buffer in plain JS and sent to the screen once.
  SOFT = W * H <= 1.6e6; masks.clear();
  if (SOFT) {
    img = ctx.createImageData(W, H); pix = img.data; pix32 = new Uint32Array(pix.buffer);
    mcan.width = AC; mcan.height = AR; mctx.textBaseline = 'top'; mctx.fillStyle = '#fff';
    mctx.font = `${FS}px ui-monospace, "SF Mono", Menlo, Consolas, monospace`;
  }
}
const mcan = document.createElement('canvas'), mctx = mcan.getContext('2d', { willReadFrequently: true }), masks = new Map();
let SOFT = false, img = null, pix = null, pix32 = null;
function soft(rgb, ch, x, y) {
  let m = masks.get(ch);
  if (!m) {                                                // the shape of this character, drawn once and kept
    mctx.clearRect(0, 0, AC, AR); mctx.fillText(ch, 0, 0);
    const d = mctx.getImageData(0, 0, AC, AR).data; m = new Uint8Array(AC * AR);
    for (let i = 0; i < m.length; i++) m[i] = d[i * 4 + 3];
    masks.set(ch, m);
  }
  const r = rgb[0], g = rgb[1], b = rgb[2];
  for (let j = 0; j < AR; j++) {
    const yy = y + j; if (yy < 0 || yy >= H) continue;
    for (let i = 0; i < AC; i++) {
      const a = m[j * AC + i]; if (!a) continue;
      const xx = x + i; if (xx < 0 || xx >= W) continue;
      const o = (yy * W + xx) * 4;
      pix[o] += ((r - pix[o]) * a) >> 8; pix[o + 1] += ((g - pix[o + 1]) * a) >> 8; pix[o + 2] += ((b - pix[o + 2]) * a) >> 8;
    }
  }
}
const atlas = document.createElement('canvas'), actx = atlas.getContext('2d'), slots = new Map();
let AC = 8, AR = 12, AN = 256;
function stamp(pal, id, level, ch, x, y) {
  if (SOFT) { soft(PRGB[id][level], ch, Math.round(x), Math.round(y)); return; }
  const key = ((id * 32 + level) << 16) | ch.charCodeAt(0); let s = slots.get(key);
  if (s === undefined) {
    if (slots.size >= 8000) { ctx.fillStyle = pal[level]; ctx.fillText(ch, x, y); return; }
    s = slots.size; slots.set(key, s); actx.fillStyle = pal[level]; actx.fillText(ch, (s % AN) * AC, ((s / AN) | 0) * AR);
  }
  ctx.drawImage(atlas, (s % AN) * AC, ((s / AN) | 0) * AR, AC, AR, Math.round(x), Math.round(y), AC, AR);
}
addEventListener('resize', resize); addEventListener('orientationchange', () => setTimeout(resize, 250)); resize();

// ---------- camera, shared by the flower and the sparks ----------
let S = 1, cx = 0, cy = 0, cyw = 1, syw = 0, cp = 1, sp = 0, sx = 1, sz = 1;
function project(k, kind, out) {
  let x = POS[k * 3], y = POS[k * 3 + 1], z = POS[k * 3 + 2];
  if (kind === ROSE) { x *= sx; y *= sx; z *= sz; }
  const x1 = x * cyw - y * syw, y1 = x * syw + y * cyw;
  const dx = x1 * S, dy = -(y1 * sp + z * cp) * S;        // then lean the whole flower, like one held out in a hand
  out[0] = cx + dx * CR - dy * SR; out[1] = cy + dx * SR + dy * CR; out[2] = y1 * cp - z * sp;
}
const ROLL = 0.21, CR = Math.cos(ROLL), SR = Math.sin(ROLL);
function proj3(x, y, z, out) {                           // the same camera for free particles
  const x1 = x * cyw - y * syw, y1 = x * syw + y * cyw, dx = x1 * S, dy = -(y1 * sp + z * cp) * S;
  out[0] = cx + dx * CR - dy * SR; out[1] = cy + dx * SR + dy * CR; out[2] = y1 * cp - z * sp;
}
const progress = (kind, t) => clamp((t - WHEN[kind][0]) / (WHEN[kind][1] - WHEN[kind][0]), 0, 1);
const fireLevel = (t) => ease((t - 0.35) / 1.3) * (1 - 0.6 * ease((t - DONE - 0.6) / 2.6)) + 0.45 * Math.exp(-Math.pow((t - DONE - 0.15) / 0.35, 2));

// ---------- one frame, a pure function of time (seconds) ----------
const tmp = [0, 0, 0];
function render(t) {
  const portrait = H > W;
  S = portrait ? Math.min(W * 0.36, H * 0.195) : H * (W / H > 1.9 ? 0.27 : 0.22);   // a little bigger on a wide phone screen
  S *= (0.93 + 0.07 * ease(t / DONE)) * (1 + (t > DONE ? 0.045 * Math.exp(-(t - DONE) / 0.45) : 0));   // slow push in, then a punch when it blooms
  cx = portrait ? W * 0.57 : W * 0.65; cy = portrait ? H * 0.31 : H * 0.41;
  const yaw = t * 0.26 + 0.6, pitch = 0.74 + 0.05 * Math.sin(t * 0.4);
  cyw = Math.cos(yaw); syw = Math.sin(yaw); cp = Math.cos(pitch); sp = Math.sin(pitch);
  const G = [progress(0, t), progress(1, t), progress(2, t), progress(3, t)];
  const breathe = 1 + 0.012 * Math.sin(t * 1.3);
  sx = (0.86 + 0.14 * ease(G[0])) * breathe; sz = (1.08 - 0.08 * ease(G[0])) * breathe;   // a tall half-open bud
  const flash = t > DONE ? Math.exp(-(t - DONE) / 0.9) : 0, FL = fireLevel(t);
  const lx = -0.42, ly = -0.55, lz = 0.72;

  // 1. depth buffer: nearest surface point for every character cell
  zbuf.fill(1e9); ibuf.fill(-1);
  const step = SOFT ? (TIER > 2 ? 13 : 7) : 1;             // a phone screen has few cells, so a seventh of the points still fills every one
  for (let k = 0; k < N; k += step) {
    const kind = META[k * 4]; if (META[k * 4 + 2] > G[kind]) continue;
    project(k, kind, tmp);
    const col = (tmp[0] / CW) | 0, row = (tmp[1] / CH) | 0;
    if (col < 0 || row < 0 || col >= COLS || row >= ROWS) continue;
    const c = row * COLS + col; if (tmp[2] < zbuf[c]) { zbuf[c] = tmp[2]; ibuf[c] = k; }
  }

  if (SOFT) pix32.fill(0xff080506); else { ctx.fillStyle = '#060508'; ctx.fillRect(0, 0, W, H); }
  ctx.textBaseline = 'top'; ctx.font = `${FS}px ui-monospace, "SF Mono", Menlo, Consolas, monospace`;
  let last = '';
  const ink = (s) => { if (s !== last) { ctx.fillStyle = s; last = s; } };
  const lvl = (a) => clamp(Math.round(a * (LV - 1)), 0, LV - 1);
  const put = (pal, id, level, str, px, py, z) => {        // glyphs on the grid from the atlas, hidden if the flower is in front
    const col = Math.round(px / CW), row = Math.round(py / CH);
    if (col < 0 || row < 0 || col >= COLS || row >= ROWS || (z !== undefined && zbuf[row * COLS + col] < z)) return;
    for (let q = 0; q < str.length; q++) stamp(pal, id, level, str[q], (col + q) * CW, row * CH);
  };

  // 2. faint drifting characters far behind
  for (let i = 0; i < 140 * LOD; i++) {
    const px = hash(i + 1) * W, py = ((hash(i + 77) - t * (0.008 + 0.02 * hash(i + 9))) % 1 + 1) % 1 * H;
    put(LOVE, 4, lvl(0.06 + 0.1 * (0.5 + 0.5 * Math.sin(t * (0.5 + hash(i + 3)) + i))), SOURCE[(i * 37) % SOURCE.length], px, py);
  }

  // 3. the fire: a bed of flames along the bottom, tallest under the stem
  const fireRows = Math.round(ROWS * (portrait ? 0.20 : 0.30)), cxc = cx / CW, wc = COLS * (portrait ? 0.34 : 0.17);
  if (FL > 0.01) for (let rb = 0; rb < fireRows; rb++) {
    const row = ROWS - 1 - rb, hN = rb / fireRows;
    for (let col = 0; col < COLS; col++) {
      const env = 0.34 + 0.66 * Math.exp(-Math.pow((col - cxc) / wc, 2));
      const n = noise(col * 0.11, rb * 0.13 - t * 2.3) * 0.62 + noise(col * 0.27 + 9, rb * 0.3 - t * 4.1) * 0.38;
      const f = clamp((n * 1.75 - hN / (env * FL + 0.001) * 1.02 + 0.12) * FL, 0, 1);
      if (f < 0.07) continue;
      stamp(FIRE, 0, clamp(Math.round(f * f * (LV - 1) * 1.1), 0, LV - 1), FLAME[Math.min(FLAME.length - 1, (f * FLAME.length) | 0)], col * CW, row * CH);
    }
  }

  // 4. the flower, one glyph per cell: white hot where it has just been forged, cooling into red and green
  for (let row = 0; row < ROWS; row++) for (let col = 0; col < COLS; col++) {
    const k = ibuf[row * COLS + col]; if (k < 0) continue;
    const kind = META[k * 4], key = META[k * 4 + 1], grow = META[k * 4 + 2], shade = META[k * 4 + 3];
    const nx = NOR[k * 3], ny = NOR[k * 3 + 1], nz = NOR[k * 3 + 2];
    const n1x = nx * cyw - ny * syw, n1y = nx * syw + ny * cyw;
    const d = Math.abs(n1x * lx + (n1y * cp - nz * sp) * ly + (n1y * sp + nz * cp) * lz);
    const age = (G[kind] - grow) * (WHEN[kind][1] - WHEN[kind][0]);          // seconds since this glyph landed
    let heat = G[kind] < 1 ? Math.exp(-age / (kind === ROSE ? 0.85 : 0.5)) : Math.exp(-(age + (t - WHEN[kind][1])) / 0.85);
    if (kind === ROSE) heat = Math.max(heat, flash * (0.55 + 0.45 * shade));
    let b;
    if (kind === ROSE) b = (0.3 + 0.7 * d) * (0.34 + 0.66 * Math.pow(shade, 0.75)) + 0.24 * Math.pow(shade, 8);
    else b = (0.22 + 0.78 * d) * (0.55 + 0.45 * shade);
    // firelight from below on the stem and leaves while the fire burns
    if (kind !== ROSE) b += 0.25 * FL * clamp((row / ROWS - 0.55) * 3, 0, 1);
    const ch = SOURCE[key % SOURCE.length];
    if (heat > 0.14) stamp(FIRE, 0, clamp(Math.round((0.25 + 0.75 * heat) * (0.55 + 0.45 * b) * (LV - 1)), 0, LV - 1), ch, col * CW, row * CH);
    else if (kind === ROSE) stamp(RED, 1, clamp(Math.round(b * (LV - 1)), 0, LV - 1), ch, col * CW, row * CH);
    else stamp(GREEN, 2, clamp(Math.round(b * (LV - 1)), 0, LV - 1), ch, col * CW, row * CH);
  }

  // 5. builder sparks: each one leaves the fire and lands exactly where the flower is being forged
  for (let i = 0; i < BUILD.length; i += TOUCH ? 2 : 1) {
    const k = BUILD[i], kind = META[k * 4], w = WHEN[kind];
    const land = w[0] + META[k * 4 + 2] * (w[1] - w[0]), fly = 0.9 + 0.5 * hash(k + 4), u = (t - (land - fly)) / fly;
    if (u <= 0 || u >= 1) continue;
    project(k, kind, tmp);
    const x0 = cx + (hash(k) - 0.5) * W * (portrait ? 0.7 : 0.42), y0 = H * (0.90 + 0.07 * hash(k + 5));
    for (let tr = 0; tr < (TOUCH ? 2 : 4); tr++) {
      const uu = u - tr * 0.045; if (uu <= 0) break;
      const e = 1 - Math.pow(1 - uu, 3), arc = Math.sin(uu * PI);
      const px = x0 + (tmp[0] - x0) * e + arc * (hash(k + 2) - 0.5) * W * 0.16;
      const py = y0 + (tmp[1] - y0) * e - arc * H * 0.05;
      put(FIRE, 0, lvl(0.98 - tr * 0.2), tr === 0 ? SOURCE[META[k * 4 + 1] % SOURCE.length] : EMBER[(k + tr) % EMBER.length], px, py);
    }
  }

  // 6. loose embers drifting up from the flames
  for (let i = 0; i < 340 * LOD; i++) {
    const period = 2.2 + 3.2 * hash(i + 21), u = ((t + hash(i + 5) * period) / period) % 1;
    const a = (1 - u) * FL; if (a < 0.05) continue;
    const px = cx + (hash(i + 31) - 0.5) * W * (portrait ? 0.95 : 0.6) + Math.sin(u * 7 + i) * W * 0.012;
    const py = H * 0.93 - u * H * (0.3 + 0.5 * hash(i + 41));
    put(FIRE, 0, lvl(a * a), EMBER[i % EMBER.length], px, py);
  }

  // 6b. a spiral of sparks winding up around the flower while it is forged
  const act = ease((t - 1.0) / 1.2) * (1 - 0.72 * ease((t - DONE - 0.4) / 2.5));
  for (let i = 0; i < 170 * LOD; i++) {
    const u = (t * (0.16 + 0.1 * hash(i + 60)) + hash(i + 61)) % 1, a = u * TAU * 2.5 + i * 2.399 + t * 0.5;
    const R = 0.5 + 0.55 * Math.sin(u * PI) + 0.15 * hash(i + 62);
    const al = Math.sin(u * PI) * act * (0.55 + 0.45 * Math.sin(t * 5 + i)); if (al < 0.05) continue;
    proj3(R * Math.cos(a), R * Math.sin(a), -3.5 + u * 5.2, tmp);
    put(t < DONE ? FIRE : DUST, t < DONE ? 0 : 3, lvl(al), i % 3 ? '.' : '+', tmp[0], tmp[1], tmp[2]);
  }

  // 6c. twinkling dust floating around the bloom
  const dustA = ease(G[0] * 3);
  if (dustA > 0.01) for (let i = 0; i < 150 * LOD; i++) {
    const tw = Math.pow(0.5 + 0.5 * Math.sin(t * (1.5 + 2 * hash(i + 73)) + i * 1.7), 3) * dustA; if (tw < 0.06) continue;
    const a = i * 2.399 + t * (0.12 + 0.2 * hash(i + 70)), el = (hash(i + 71) - 0.5) * 2.4, R = 0.9 + 1.2 * hash(i + 72);
    proj3(R * Math.cos(a) * Math.cos(el * 0.6), R * Math.sin(a) * Math.cos(el * 0.6), 0.6 + el * 0.75 + 0.12 * Math.sin(t * 0.7 + i), tmp);
    put(DUST, 3, lvl(tw), tw > 0.6 ? '*' : tw > 0.3 ? '+' : '.', tmp[0], tmp[1], tmp[2]);
  }

  // 6d. the bloom burst: the moment it is finished, sparks fly out of the flower in every direction
  if (t > DONE && t < DONE + 3.4) {
    const s = t - DONE; proj3(0, 0, 0.7, tmp); const bx = tmp[0], by = tmp[1];
    for (let i = 0; i < 340 * LOD; i++) {
      const al = Math.pow(1 - s / 3.4, 1.6) * (0.6 + 0.4 * hash(i + 82)); if (al < 0.04) continue;
      const a = hash(i + 80) * TAU, d = (1 - Math.exp(-2.4 * s)) * (0.25 + 0.75 * hash(i + 81)) * Math.min(W, H) * 0.62;
      put(FIRE, 0, lvl(al), i % 4 === 0 ? SOURCE[(i * 13) % SOURCE.length] : EMBER[i % EMBER.length], bx + Math.cos(a) * d, by + Math.sin(a) * d * 0.8 + s * s * H * 0.022);
    }
  }

  // 6e. petals falling through the dark, tumbling as they go
  for (let i = 0; i < 54; i++) {
    const period = 7 + 6 * hash(i + 90), s = t - DONE - 0.8 - hash(i + 91) * period; if (s < 0) continue;
    const u = (s / period) % 1, lap = Math.floor(s / period), tum = Math.sin(u * 22 + i * 3);
    put(RED, 1, lvl(0.3 + 0.6 * Math.abs(tum)), tum > 0.45 ? '(@)' : tum < -0.45 ? '{o}' : tum > 0 ? '()' : '|', hash(i + 92 + lap * 7.1) * W + Math.sin(u * 5 + i) * W * 0.05, -0.04 * H + u * H * 1.08);
  }

  // 6f. little <3 rising from the bloom
  proj3(0, 0, 0.9, tmp);
  for (let i = 0; i < 12; i++) {
    const period = 5 + 4 * hash(i + 100), s = t - DONE - 2 - hash(i + 101) * period; if (s < 0) continue;
    const u = (s / period) % 1, al = Math.sin(u * PI) * 0.85; if (al < 0.05) continue;
    put(LOVE, 4, lvl(al), '<3', tmp[0] + (hash(i + 102 + Math.floor(s / period) * 3.3) - 0.5) * S * 2.8 + Math.sin(u * 6 + i) * S * 0.15, tmp[1] - u * S * 2.4);
  }

  if (SOFT) ctx.putImageData(img, 0, 0);

  // 7. soft glow: a quarter-size copy added back on top
  if (TIER < 2) {
    gctx.clearRect(0, 0, glow.width, glow.height); gctx.drawImage(canvas, 0, 0, glow.width, glow.height);
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.5 + 0.6 * flash; ctx.drawImage(glow, 0, 0, W, H); ctx.restore();
  }
  // night: the edges fall away into black, like a flash photo in the dark
  const vg = ctx.createRadialGradient(cx, cy + S * 0.6, S * 1.1, cx, cy + S * 0.6, Math.hypot(W, H) * 0.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H); last = '';

  // 8. the typed code and the build log
  // sized so the longest line (52 characters) fits the space and stays readable on a phone
  const fit = (portrait ? W * 0.86 : W * 0.42) / (52 * 0.61);
  // the size is set in screen points, so it stays the same small size whatever resolution the picture is drawn at
  const TS = Math.max(6, Math.round(Math.min(fit * 0.86, (TOUCH ? 7.5 : portrait ? 12 : 11) * DPR))), lh = TS * 1.5;
  ctx.font = `${TS}px ui-monospace, "SF Mono", Menlo, Consolas, monospace`;
  const tx = portrait ? W * 0.07 : W * 0.055, ty = portrait ? H * 0.60 : H * 0.44 - (LINES.length + 3) * lh / 2;
  if (portrait) {                                          // on a phone the stem runs behind the code: dim it there so the code stays readable
    const y0 = ty - lh * 1.6, y1 = ty + (LINES.length + 6.4) * lh, sh = ctx.createLinearGradient(0, y0, 0, y1);
    sh.addColorStop(0, 'rgba(6,5,8,0)'); sh.addColorStop(0.14, 'rgba(6,5,8,0.74)'); sh.addColorStop(0.86, 'rgba(6,5,8,0.74)'); sh.addColorStop(1, 'rgba(6,5,8,0)');
    ctx.fillStyle = sh; ctx.fillRect(0, y0, W, y1 - y0);
  }
  let budget = Math.floor(Math.max(0, t - 0.2) * 38), i = 0;
  for (; i < LINES.length; i++) {
    const s = LINES[i], n = Math.min(s.length, budget); budget -= s.length + 3;
    if (n <= 0) break;
    ctx.fillStyle = s.startsWith('//') ? 'rgba(255,255,255,0.34)' : i === 1 ? 'rgba(255,170,90,0.95)' : 'rgba(226,228,236,0.74)';
    const c = s.indexOf('//', 1);                          // a trailing comment is the message: draw it in rose red
    ctx.fillText(s.slice(0, c > 0 ? Math.min(n, c) : n), tx, ty + i * lh);
    if (c > 0 && n > c) { ctx.fillStyle = 'rgba(226,40,62,0.98)'; ctx.fillText(s.slice(c, n), tx + ctx.measureText(s.slice(0, c)).width, ty + i * lh); }
    if (n < s.length) { ctx.fillStyle = 'rgba(255,170,90,0.95)'; ctx.fillRect(tx + ctx.measureText(s.slice(0, n)).width + 2, ty + i * lh, TS * 0.55, TS); break; }
  }
  const total = (G[1] * 0.14 + G[2] * 0.12 + G[3] * 0.04 + G[0] * 0.70), pct = Math.floor(total * 100);
  const stage = t < WHEN[1][0] ? 'igniting' : G[1] < 1 ? 'forging stem' : G[0] <= 0 ? 'forging leaves' : G[0] < 1 ? 'forging petals' : 'done';
  const ly2 = ty + (LINES.length + 1) * lh;
  if (t > 0.5) {
    const bar = '#'.repeat(Math.round(total * 24)).padEnd(24, '.');
    ctx.fillStyle = 'rgba(255,170,90,0.92)'; ctx.fillText(`> ${stage}`, tx, ly2);
    ctx.fillStyle = 'rgba(226,228,236,0.6)'; ctx.fillText(`  [${bar}] ${String(pct).padStart(3)}%  ${Math.floor(total * N).toLocaleString('en-US')} glyphs`, tx, ly2 + lh);
    if (t > DONE + 0.5) {
      const s = 'bloom()  // for you', n = Math.min(s.length, Math.floor((t - DONE - 0.5) * 22));
      ctx.fillStyle = 'rgba(214,32,52,0.98)'; ctx.fillText(s.slice(0, n), tx, ly2 + lh * 2.6);
      if (n < s.length || Math.floor(t * 2.2) % 2 === 0) ctx.fillRect(tx + ctx.measureText(s.slice(0, n)).width + 2, ly2 + lh * 2.6, TS * 0.55, TS);
      const hint = ease((t - DONE - 3) / 1.5) * (0.28 + 0.12 * Math.sin(t * 1.6));
      if (hint > 0.01) { ctx.fillStyle = `rgba(255,255,255,${hint.toFixed(3)})`; ctx.fillText(TOUCH ? '// tap to forge it again' : '// click to forge it again', tx, ly2 + lh * 4.2); }
    }
  }
}

// ---------- run: it always forges itself from nothing when the page opens ----------
window.__renderFrame = (frame, fps = 60) => render(frame / fps);          // for frame-by-frame video export
let T0 = performance.now();
const fixed = new URLSearchParams(location.search).get('t');
const again = () => { T0 = performance.now(); };
addEventListener('click', again); addEventListener('keydown', (e) => { if (e.code === 'Space') again(); });
// A slow phone never gets a coarser picture. It sheds work in steps instead:
//   tier 1: 30 frames a second    tier 2: no glow pass    tier 3: fewer surface points
let TIER = 0, prev = 0, slow = 0, lastDraw = -1e9;
function loop() {
  const now = performance.now();
  if (fixed !== null) { render(+fixed); return; }
  requestAnimationFrame(loop);
  if (TIER > 0 && now - lastDraw < 30) return;             // hold a steady 30 instead of a stuttering 60
  const gap = now - lastDraw; lastDraw = now;
  render((now - T0) / 1000);
  const work = performance.now() - now, late = TIER === 0 ? (work > 13 || gap > 24) : (work > 26 || gap > 46);
  if (gap < 500) { slow = late ? slow + 1 : Math.max(0, slow - 1); if (slow > 24 && TIER < 3) { TIER++; slow = 0; } }
}
loop();
</script>
